<svg xmlns="http://www.w3.org/2000/svg" width="2850" height="2230" viewBox="0 0 2850 2230"><title>05 — Contact</title><rect x="0" y="0" width="2850" height="2230" rx="0" fill="#EEF1F7" stroke="none" /><text x="80" y="86" font-family="Inter" font-size="42" font-weight="700" fill="#0A0A3A">05 / LIÊN HỆ &amp; TRẠNG THÁI BIỂU MẪU</text><text x="80" y="130" font-family="Inter" font-size="19" font-weight="400" fill="#555B70">Ảnh 1–6: thông tin bên trái, biểu mẫu bên phải. Mobile xếp dọc, nhãn rõ và CTA toàn chiều rộng.</text><text x="80" y="165" font-family="Inter" font-size="14" font-weight="400" fill="#555B70">LIGHT THEME V1 · DESKTOP 1440 / MOBILE 390 · Nội dung &amp; số liệu chưa xác nhận dùng ô giữ chỗ</text><g id="05.1 / Contact — Desktop" transform="translate(80 260)"><text x="0" y="-22" font-family="Inter" font-size="21" font-weight="600" fill="#0A0A3A">05.1 / Contact — Desktop</text><svg x="0" y="0" width="1440" height="1400" viewBox="0 0 1440 1400" id="05.1 / Contact — Desktop"><title>05.1 / Contact — Desktop</title><rect x="0" y="0" width="1440" height="1400" rx="0" fill="#FEFDF8" stroke="none" /><g id="Navigation" transform="translate(0 0)"><rect x="0" y="0" width="1440" height="88" rx="0" fill="#FEFDF8" stroke="#D7DFF0" /><text x="80" y="49" font-family="Inter" font-size="20" font-weight="700" fill="#0A0A3A">TT / TRAN TRINH</text><text x="530" y="49" font-family="Inter" font-size="14" font-weight="400" fill="#555B70">Trang chủ     Dự án     Bài viết     Giới thiệu     CV</text><g id="Button — Kết nối" transform="translate(1190 20)"><rect x="0" y="0" width="170" height="48" rx="10" fill="#05308C" stroke="#D7DFF0" /><text x="18" y="30" font-family="Inter" font-size="15" font-weight="600" fill="#FEFDF8">Kết nối</text></g></g><g id="Contact heading" transform="translate(80 145)"><text x="0" y="20" font-family="Inter" font-size="12" font-weight="600" fill="#555B70">LET’S CONNECT</text><text x="0" y="72" font-family="Inter" font-size="42" font-weight="650" fill="#0A0A3A">Bắt đầu một cuộc trao đổi.</text><text x="0" y="110" font-family="Inter" font-size="17" font-weight="400" fill="#555B70">Cơ hội nghề nghiệp, dự án hợp tác hoặc kết nối chuyên môn.</text></g><g id="Contact information" transform="translate(80 365)"><text x="0" y="30" font-family="Inter" font-size="32" font-weight="650" fill="#0A0A3A">Mọi dự án tốt đều bắt đầu</text><text x="0" y="76" font-family="Inter" font-size="32" font-weight="650" fill="#0A0A3A">từ một cuộc trò chuyện.</text><text x="0" y="145" font-family="Inter" font-size="17" font-weight="400" fill="#555B70">[Đoạn giới thiệu ngắn về nhu cầu kết nối]</text><g id="Email" transform="translate(0 220)"><text x="0" y="0" font-family="Inter" font-size="11" font-weight="600" fill="#555B70">EMAIL</text><text x="0" y="35" font-family="Inter" font-size="18" font-weight="400" fill="#0A0A3A">[Thông tin sẽ được xác nhận]</text></g><g id="LinkedIn" transform="translate(0 320)"><text x="0" y="0" font-family="Inter" font-size="11" font-weight="600" fill="#555B70">LINKEDIN</text><text x="0" y="35" font-family="Inter" font-size="18" font-weight="400" fill="#0A0A3A">[Thông tin sẽ được xác nhận]</text></g><g id="Địa điểm / Múi giờ" transform="translate(0 420)"><text x="0" y="0" font-family="Inter" font-size="11" font-weight="600" fill="#555B70">ĐỊA ĐIỂM / MÚI GIỜ</text><text x="0" y="35" font-family="Inter" font-size="18" font-weight="400" fill="#0A0A3A">[Thông tin sẽ được xác nhận]</text></g><g id="Minh họa / texture nhẹ" transform="translate(0 600)"><rect x="0" y="0" width="450" height="180" rx="14" fill="#F0F3FA" stroke="#D7DFF0" /><path d="M20 20L430 160M430 20L20 160" stroke="#DCE4F1" stroke-width="1" /><rect x="115" y="70" width="220" height="40" rx="8" fill="#FEFDF8" stroke="#D7DFF0" /><text x="131" y="96" font-family="Inter" font-size="13" font-weight="400" fill="#555B70">Minh họa / texture nhẹ</text></g></g><g id="Contact form / ảnh 1 + 6" transform="translate(620 365)"><rect x="0" y="0" width="740" height="780" r