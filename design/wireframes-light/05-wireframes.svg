r" font-size="13" font-weight="400" fill="#555B70">LinkedIn  /  GitHub  /  Email</text></g></svg></g><g id="Form states" transform="translate(2120 260)"><text x="0" y="-22" font-family="Inter" font-size="21" font-weight="650" fill="#0A0A3A">05.3 / Trạng thái &amp; hành vi</text><rect x="0" y="0" width="650" height="1570" rx="16" fill="#FFFFFF" stroke="#D7DFF0" /><text x="28" y="58" font-family="Inter" font-size="14" font-weight="600" fill="#555B70">01 / TRƯỚC KHI GỬI</text><text x="28" y="105" font-family="Inter" font-size="20" font-weight="600" fill="#0A0A3A">Kiểm tra dữ liệu ngay tại trường nhập.</text><g id="Field — Email *" transform="translate(28 165)"><text x="0" y="0" font-family="Inter" font-size="13" font-weight="400" fill="#555B70">Email *</text><rect x="0" y="14" width="594" height="54" rx="8" fill="#FEFDF8" stroke="#D7DFF0" /></g><text x="28" y="260" font-family="Inter" font-size="14" font-weight="400" fill="#AD1F23">Vui lòng nhập địa chỉ email hợp lệ.</text><text x="28" y="350" font-family="Inter" font-size="14" font-weight="600" fill="#555B70">02 / ĐANG GỬI</text><g id="Button — Đang gửi…" transform="translate(28 390)"><rect x="0" y="0" width="594" height="48" rx="10" fill="#05308C" stroke="#D7DFF0" /><text x="18" y="30" font-family="Inter" font-size="15" font-weight="600" fill="#FEFDF8">Đang gửi…</text></g><text x="28" y="480" font-family="Inter" font-size="15" font-weight="400" fill="#555B70">Khóa nút gửi; giữ nguyên nội dung đã nhập.</text><text x="28" y="585" font-family="Inter" font-size="14" font-weight="600" fill="#555B70">03 / THÀNH CÔNG</text><rect x="28" y="625" width="594" height="180" rx="12" fill="#FEFDF8" stroke="#D7DFF0" /><text x="52" y="674" font-family="Inter" font-size="25" font-weight="650" fill="#0A0A3A">Đã nhận được lời nhắn.</text><text x="52" y="719" font-family="Inter" font-size="15" font-weight="400" fill="#555B70">Thông báo xác nhận và xóa trắng biểu mẫu.</text><text x="28" y="910" font-family="Inter" font-size="14" font-weight="600" fill="#555B70">04 / CHƯA THỂ GỬI</text><rect x="28" y="950" width="594" height="180" rx="12" fill="#FEFDF8" stroke="#AD1F23" /><text x="52" y="999" font-family="Inter" font-size="23" font-weight="650" fill="#0A0A3A">Chưa thể gửi tin nhắn lúc này.</text><text x="52" y="1044" font-family="Inter" font-size="14" font-weight="400" fill="#555B70">Giữ nội dung, cho phép thử lại hoặc liên hệ email.</text><text x="28" y="1240" font-family="Inter" font-size="14" font-weight="600" fill="#555B70">THỨ TỰ TAB</text><text x="28" y="1285" font-family="Inter" font-size="16" font-weight="400" fill="#0A0A3A">Họ tên → Email → Công ty → Mục đích</text><text x="28" y="1325" font-family="Inter" font-size="16" font-weight="400" fill="#0A0A3A">→ Nội dung → Xác minh → Gửi tin nhắn</text><text x="28" y="1435" font-family="Inter" font-size="15" font-weight="400" fill="#555B70">Nhãn luôn hiển thị; lỗi không chỉ biểu thị bằng màu.</text></g></svg>